name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Write keystore.properties
        run: |
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}"          \
            "${{ secrets.KEY_PASSWORD }}"        \
            > keystore.properties

      - name: Read version
        id: ver
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"

      # Three artefacts, one run, one keystore.
      #
      # `github` APK — the sideload build, with the design assistant and the
      # in-app update checker. This is what a human downloads and installs.
      #
      # `play` bundle — the Play Store build: no assistant, no updater, no
      # INTERNET permission (see app/src/play/). An .aab, because Play has taken
      # bundles only since 2021.
      #
      # `play` APK — the same build as that bundle, installable. Play cannot
      # accept it, and it is not what most people want; it is here so the Play
      # build can be put on a phone and checked. A bundle is not a thing you can
      # sideload, so without this the only way to try what Play users actually
      # get is to publish to a test track and wait for review.
      #
      # All three are signed by the `release` build type's signingConfig, so the
      # one keystore.properties written above covers them and none can drift from
      # another's commit.
      - name: Build release artefacts
        run: >
          ./gradlew assembleGithubRelease bundlePlayRelease assemblePlayRelease
          --no-daemon

      - name: Rename artefacts
        run: |
          mv app/build/outputs/apk/github/release/app-github-release.apk \
             app/build/outputs/apk/github/release/glyphworks-${{ steps.ver.outputs.name }}.apk
          mv app/build/outputs/bundle/playRelease/app-play-release.aab \
             app/build/outputs/bundle/playRelease/glyphworks-${{ steps.ver.outputs.name }}-play.aab
          mv app/build/outputs/apk/play/release/app-play-release.apk \
             app/build/outputs/apk/play/release/glyphworks-${{ steps.ver.outputs.name }}-play.apk

      # Absent a keystore.properties, Gradle emits an UNSIGNED release build
      # rather than failing — so a secret that is missing, renamed or expired
      # produces a green run and a tagged release whose bundle the Play Console
      # rejects hours later. Catch it here, while the tag does not exist yet.
      #
      # Two traps, both measured rather than assumed:
      #
      #   * `jarsigner -verify` exits 0 for an unsigned jar as happily as for a
      #     signed one — it just prints "jar is unsigned." So the verdict line is
      #     the check and the exit code is worthless.
      #   * `-strict` is NOT usable here: it exits 4 on a self-signed certificate,
      #     and every Android release key is self-signed.
      #
      # APKs get apksigner, which does return a meaningful exit code.
      - name: Verify all three artefacts are signed with one key
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.name }}
          AAB=app/build/outputs/bundle/playRelease/glyphworks-$V-play.aab
          GH_APK=app/build/outputs/apk/github/release/glyphworks-$V.apk
          PLAY_APK=app/build/outputs/apk/play/release/glyphworks-$V-play.apk

          # Resolved to ONE path, highest version. Left as a glob,
          # build-tools/*/apksigner expands to every installed version and the
          # runner image ships several: the first becomes the command and the
          # rest become its arguments.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)

          if ! jarsigner -verify "$AAB" | grep -qx "jar verified."; then
            echo "::error::$AAB is not signed — check the KEYSTORE_* secrets"
            exit 1
          fi
          "$APKSIGNER" verify "$GH_APK"
          "$APKSIGNER" verify "$PLAY_APK"

          # Play ties an app to one signing certificate for good, and the sideload
          # APK must stay installable over the top of itself. All three come from
          # the `release` build type's signingConfig, so a mismatch means
          # something has gone wrong in a way worth stopping for.
          # keytool prints "\t SHA256: 76:0A:F4:…"; apksigner prints bare lowercase
          # hex. awk takes the second field so the label cannot survive into the
          # value — stripping it with tr/sed instead mangles the "A" of "SHA256".
          AAB_CERT=$(keytool -printcert -jarfile "$AAB" | awk '/SHA256:/ {print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          GH_CERT=$("$APKSIGNER" verify --print-certs "$GH_APK" \
                    | grep -m1 -i "SHA-256 digest" | awk '{print $NF}')
          PLAY_CERT=$("$APKSIGNER" verify --print-certs "$PLAY_APK" \
                      | grep -m1 -i "SHA-256 digest" | awk '{print $NF}')
          if [ "$AAB_CERT" != "$GH_CERT" ] || [ "$PLAY_CERT" != "$GH_CERT" ]; then
            echo "::error::artefacts are signed with different keys (aab=$AAB_CERT github=$GH_CERT play=$PLAY_CERT)"
            exit 1
          fi
          echo "all three artefacts signed with $GH_CERT"

      - name: Build release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "## Changes"
            if [ -z "$PREV" ]; then
              echo "- Initial version"
            else
              git log --pretty=format:"- %s" "${PREV}..HEAD"
            fi
          } > /tmp/release_notes.md

      # All three assets go on the release. Two of them are not what a visitor
      # wants, and one of those cannot even be installed, so the notes lead with
      # which file to take before anyone downloads the wrong one.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.ver.outputs.name }}
          {
            echo "### Which file?"
            echo
            echo "| File | For |"
            echo "|---|---|"
            echo "| **glyphworks-$V.apk** | **Install this one.** The full build: design assistant and in-app update checker included. |"
            echo "| glyphworks-$V-play.aab | Upload to the Play Console. Not installable. |"
            echo "| glyphworks-$V-play.apk | The Play build, installable — for checking what Play users get. No assistant, no updater, no INTERNET permission. |"
            echo
            cat /tmp/release_notes.md
          } > /tmp/release_body.md

          gh release create "v$V" \
            --title "GlyphWorks $V" \
            --notes-file /tmp/release_body.md \
            "app/build/outputs/apk/github/release/glyphworks-$V.apk" \
            "app/build/outputs/bundle/playRelease/glyphworks-$V-play.aab" \
            "app/build/outputs/apk/play/release/glyphworks-$V-play.apk"