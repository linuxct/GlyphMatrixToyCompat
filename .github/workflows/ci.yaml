name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # Both flavours, always. The two `ui/OptionalFeatures.kt` files must keep
      # identical signatures and nothing but a build of the other flavour checks
      # that — building only `github` would let `play` rot silently until release
      # day. The unit tests differ per flavour by design: `github` runs the AI and
      # updater suites, `play` does not have that code to test.
      - name: Build and test both flavours
        run: >
          ./gradlew assembleGithubDebug assemblePlayDebug
          testGithubDebugUnitTest testPlayDebugUnitTest --no-daemon

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: glyphworks-debug
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 30